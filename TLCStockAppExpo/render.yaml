services:
  - type: web
    name: tlc-pharmasight-web
    env: node
    region: oregon
    plan: free
    buildCommand: npm ci --legacy-peer-deps || npm install --legacy-peer-deps && npm run render:build
    startCommand: npm run render:start
    envVars:
      - key: NODE_VERSION
        value: 18.20.5
      - key: NODE_ENV
        value: production

